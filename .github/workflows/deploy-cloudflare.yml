name: Deploy Yamamoto Auto to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'japan-yamamoto-auto-website-professional-home/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: yamamoto-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: japan-yamamoto-auto-website-professional-home
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN GitHub secret is missing."; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID GitHub secret is missing."; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Validate Worker
        run: |
          node --check src/worker.js
          node --test tests/*.test.mjs
      - name: Verify administrator access before deployment
        run: node scripts/check-admin-readiness.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: npx --yes wrangler@latest d1 migrations apply yamamoto-auto-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test real password verification
        run: |
          set -e
          curl --http1.1 -sS -D /tmp/login_headers.txt -o /tmp/login_body.txt -X POST "https://yamamoto-auto.nawodyasrajapaksha.workers.dev/api/login" -H "content-type: application/json" --data '{"email":"fujim2021@gmail.com","password":"definitely-wrong-password"}'
          status=$(awk 'NR==1 {print $2}' /tmp/login_headers.txt)
          echo "HTTP status: $status"
          cat /tmp/login_body.txt
          test "$status" = "401" || test "$status" = "403"

