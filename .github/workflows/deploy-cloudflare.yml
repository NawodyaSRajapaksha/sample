name: Deploy Yamamoto Auto to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'japan-yamamoto-auto-website-professional-home/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: japan-yamamoto-auto-website-professional-home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN GitHub secret is missing."; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID GitHub secret is missing."; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker authentication implementation
        run: |
          grep -n 'node:crypto' src/worker.js
          grep -n 'function pbkdf2' src/worker.js
          grep -n 'TEMP_BOOTSTRAP_PASSWORD' src/worker.js
          if grep -q 'crypto.subtle.deriveBits.*PBKDF2' src/worker.js; then
            echo 'WebCrypto PBKDF2 implementation is still present.'
            exit 1
          fi
          if ! grep -q 'iterations=100000' src/worker.js; then
            echo 'PBKDF2 iteration count is not 100000.'
            exit 1
          fi

      - name: Apply D1 migrations
        run: npx --yes wrangler@latest d1 migrations apply yamamoto-auto-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test real password verification
        run: |
          set -e
          echo "Testing deployed /api/login with a real admin email and an intentionally wrong password..."
          curl --http1.1 -sS -D /tmp/login_headers.txt -o /tmp/login_body.txt \
            -X POST "https://yamamoto-auto.nawodyasrajapaksha.workers.dev/api/login" \
            -H "content-type: application/json" \
            --data '{"email":"fujim2021@gmail.com","password":"definitely-wrong-password"}'
          status=$(awk 'NR==1 {print $2}' /tmp/login_headers.txt)
          echo "HTTP status: $status"
          echo "Response body:"
          cat /tmp/login_body.txt
          echo
          if [ "$status" != "401" ]; then
            echo "Real password-verification smoke test failed: expected HTTP 401, not a server error."
            exit 1
          fi
          echo "Real password-verification smoke test passed."
