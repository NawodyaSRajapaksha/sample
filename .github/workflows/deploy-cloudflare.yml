name: Deploy Yamamoto Auto to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'japan-yamamoto-auto-website-professional-home/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: japan-yamamoto-auto-website-professional-home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN GitHub secret is missing."; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID GitHub secret is missing."; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare Worker authentication compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/worker.js")
          s = p.read_text()

          s = re.sub(r'^import \{[^\n]*\} from "node:crypto";\n', '', s, count=1, flags=re.M)
          s = 'import { pbkdf2Sync as nodePbkdf2Sync } from "node:crypto";\n' + s

          pattern = r'async function pbkdf2\(password,salt,iterations=120000\)\{.*?\}'
          replacement = 'async function pbkdf2(password,salt,iterations=120000){return nodePbkdf2Sync(password,salt,iterations,32,"sha256").toString("hex");}'
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not locate PBKDF2 function; refusing to deploy.")

          # Do not touch the obsolete bootstrap table during requests.
          s = re.sub(r'^\s*await env\.DB\.prepare\(`CREATE TABLE IF NOT EXISTS yamamoto_admin_bootstrap_v1.*?\n', '', s, count=1, flags=re.M)
          s = re.sub(r'^\s*await env\.DB\.prepare\("INSERT OR IGNORE INTO yamamoto_admin_bootstrap_v1.*?\n', '', s, count=1, flags=re.M)

          p.write_text(s)
          print("PBKDF2 compatibility patch applied.")
          PY

      - name: Verify patched Worker source
        run: |
          grep -n 'node:crypto' src/worker.js
          grep -n 'async function pbkdf2' src/worker.js

      - name: Apply D1 migrations
        run: npx --yes wrangler@latest d1 migrations apply yamamoto-auto-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test login endpoint
        run: |
          set +e
          echo "Testing deployed /api/login with an intentionally invalid empty JSON body..."
          curl --http1.1 -sS -D /tmp/login_headers.txt -o /tmp/login_body.txt \
            -X POST "https://yamamoto-auto.nawodyasrajapaksha.workers.dev/api/login" \
            -H "content-type: application/json" \
            --data '{}'
          status=$(awk 'NR==1 {print $2}' /tmp/login_headers.txt)
          echo "HTTP status: $status"
          echo "Response body:"
          cat /tmp/login_body.txt
          echo
          if [ "$status" = "500" ]; then
            echo "Login endpoint still returns 500."
            exit 1
          fi
          if [ "$status" != "400" ]; then
            echo "Unexpected login smoke-test status: $status"
            exit 1
          fi
          echo "Login endpoint smoke test passed."
