name: Deploy Yamamoto Auto to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'japan-yamamoto-auto-website-professional-home/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: japan-yamamoto-auto-website-professional-home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN GitHub secret is missing."; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID GitHub secret is missing."; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare Worker authentication compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/worker.js")
          s = p.read_text()

          # Use Workers' supported Node crypto implementation for the existing
          # 120,000-iteration PBKDF2 hashes.
          if 'from "node:crypto"' not in s:
              s = 'import { pbkdf2Sync as nodePbkdf2Sync } from "node:crypto";\n' + s
          else:
              s = s.replace('import { pbkdf2 as nodePbkdf2 } from "node:crypto";', 'import { pbkdf2Sync as nodePbkdf2Sync } from "node:crypto";')

          old_webcrypto = 'async function pbkdf2(password,salt,iterations=120000){const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations,hash:"SHA-256"},key,256);return hex(bits)}'
          old_callback = 'async function pbkdf2(password,salt,iterations=120000){return await new Promise((resolve,reject)=>nodePbkdf2(password,salt,iterations,32,"sha256",(error,key)=>error?reject(error):resolve(key.toString("hex"))));}'
          old_sync = 'async function pbkdf2(password,salt,iterations=120000){return nodePbkdf2Sync(password,salt,iterations,32,"sha256").toString("hex");}'
          new = old_sync
          if old_webcrypto in s:
              s = s.replace(old_webcrypto, new, 1)
          elif old_callback in s:
              s = s.replace(old_callback, new, 1)

          # The bootstrap table is no longer needed by the request path. Older
          # preview databases created it with a different schema, which could
          # make ensureSchema fail before /api/login was reached. Leave the
          # table alone and stop creating/inserting into it at runtime.
          s = s.replace('    await env.DB.prepare(`CREATE TABLE IF NOT EXISTS yamamoto_admin_bootstrap_v1 (id INTEGER PRIMARY KEY CHECK(id=1),created_at TEXT NOT NULL)`).run();\n', '')
          s = s.replace('    await env.DB.prepare("INSERT OR IGNORE INTO yamamoto_admin_bootstrap_v1(id,created_at) VALUES(1,?)").bind(nowIso()).run();\n', '')

          p.write_text(s)
          PY

      - name: Apply D1 migrations
        run: npx --yes wrangler@latest d1 migrations apply yamamoto-auto-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
