name: Repair Yamamoto Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore known-good Worker
        working-directory: japan-yamamoto-auto-website-professional-home
        run: git checkout 973a36d0d6fdbe8febd4892302e0acae5dfd5b9e -- src/worker.js

      - name: Apply required Worker fixes
        working-directory: japan-yamamoto-auto-website-professional-home
        run: node ../.github/repair-worker.mjs

      - name: Validate Worker
        working-directory: japan-yamamoto-auto-website-professional-home
        run: node --check src/worker.js

      - name: Commit repaired Worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add japan-yamamoto-auto-website-professional-home/src/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix worker image limits and sold image cleanup"
          git push
