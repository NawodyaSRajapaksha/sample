name: Validate Yamamoto changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: japan-yamamoto-auto-website-professional-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check src/worker.js
      - run: node --test tests/*.test.mjs
      - run: for file in public/*.js; do node --check "$file"; done
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japanese-interface-previews
          path: japan-yamamoto-auto-website-professional-home/tests/home-*.png
