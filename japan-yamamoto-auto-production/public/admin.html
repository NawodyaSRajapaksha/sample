<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面 | 株式会社 山本オート</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-shell">
<div id="loginView" class="login panel"><div class="eyebrow">管理者専用</div><h1 style="font-size:34px">機械カタログ管理</h1><p class="muted">株式会社 山本オートの管理画面です。</p>
<form onsubmit="login(event)"><div class="field"><label>Mail</label><input id="email" type="email" required autocomplete="username" placeholder="管理者のMail"></div><div class="field"><label>パスワード</label><div style="display:flex;gap:8px"><input id="password" type="password" required autocomplete="current-password" style="flex:1"><button class="btn" type="button" onclick="togglePassword('password')">表示</button></div></div><button class="btn primary" style="width:100%">ログイン</button><p id="loginMsg" class="muted"></p></form>
<button class="btn" style="width:100%;margin-top:10px" onclick="showSetup()">初回設定・管理者アカウント作成</button>
</div>

<div id="setupView" class="login panel hidden"><div class="eyebrow">初回設定</div><h1 style="font-size:30px">管理者アカウントを設定</h1><p class="muted">CloudflareのSecretに設定した初回設定キーを入力し、管理者2名を登録してください。パスワードは12文字以上にしてください。</p>
<form onsubmit="setupAccounts(event)"><div class="field"><label>初回設定キー</label><input id="setupToken" type="password" required autocomplete="off"></div>
<h3 style="margin:20px 0 10px">管理者 1</h3><div class="field"><label>Mail</label><input id="a1email" type="email" required></div><div class="field"><label>名前</label><input id="a1name"></div><div class="field"><label>パスワード</label><input id="a1pass" type="password" minlength="12" required></div>
<h3 style="margin:20px 0 10px">管理者 2</h3><div class="field"><label>Mail</label><input id="a2email" type="email" required></div><div class="field"><label>名前</label><input id="a2name"></div><div class="field"><label>パスワード</label><input id="a2pass" type="password" minlength="12" required></div>
<button class="btn primary" style="width:100%">2名を登録</button><p id="setupMsg" class="muted"></p></form><button class="btn" onclick="showLogin()">ログイン画面へ戻る</button></div>

<div id="adminView" class="hidden"><header class="admin-top"><div class="admin-wrap admin-top-row"><div><strong>株式会社 山本オート</strong><div class="muted" style="font-size:12px">モバイル管理画面</div></div><button class="btn" onclick="logout()">ログアウト</button></div></header>
<main class="admin-wrap">
<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2 style="font-size:28px">機械一覧</h2><div id="adminUser" class="muted"></div></div><button class="btn red" onclick="newMachine()">+ 機械を追加</button></div><div id="machineList" class="machine-list" style="margin-top:18px"></div></div>

<div class="panel"><h2 style="font-size:24px">アカウント設定</h2><p class="muted">現在ログインしている管理者のパスワードを変更できます。</p><form onsubmit="changePassword(event)" style="max-width:560px"><div class="field"><label>現在のパスワード</label><input id="currentPassword" type="password" required autocomplete="current-password"></div><div class="field"><label>新しいパスワード</label><input id="newPassword" type="password" minlength="12" required autocomplete="new-password"></div><div class="field"><label>新しいパスワード（確認）</label><input id="confirmPassword" type="password" minlength="12" required autocomplete="new-password"></div><button class="btn primary">パスワードを変更</button><p id="passwordMsg" class="muted"></p></form></div>

<div id="editor" class="panel hidden"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 id="editorTitle" style="font-size:28px">機械を追加</h2><button class="btn" onclick="closeEditor()">閉じる</button></div>
<input type="hidden" id="pid"><div class="admin-grid"><div class="field"><label>機械タイトル</label><input id="ptitle" placeholder="クボタ KH-012 ミニショベル"></div><div class="field"><label>カテゴリー</label><input id="pcategory" placeholder="ミニショベル"></div></div>
<div class="field"><label>説明</label><textarea id="pdesc" placeholder="機械の状態・特徴など"></textarea></div><div class="admin-grid"><div class="field"><label>YouTube URL</label><input id="pvideo" placeholder="https://youtu.be/..."></div><div class="field"><label>販売状態</label><select id="pstatus"><option value="published">販売中</option><option value="draft">下書き</option><option value="sold">売約済み</option></select></div></div>
<div class="admin-grid"><div class="field"><label>価格表示</label><select id="pmode"><option value="contact">価格はお問い合わせください</option><option value="show">価格を表示</option></select></div><div class="field"><label>価格</label><input id="pprice" placeholder="¥1,280,000"></div></div>
<div class="field"><label>機械写真</label><input id="pimages" type="file" accept="image/*" multiple><div id="imagePreview" class="spec-chips"></div></div>
<div class="field"><label>仕様</label><div id="specs"></div><button type="button" class="btn" onclick="addSpec()">+ 仕様を追加</button></div>
<div class="actions"><button class="btn primary" onclick="saveMachine()">機械を保存</button><button class="btn" onclick="closeEditor()">キャンセル</button></div><p id="saveMsg" class="muted"></p></div>
</main></div><script src="/admin.js"></script></body></html>
