<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面 | 株式会社 山本オート</title>
<link rel="stylesheet" href="styles.css">
<style>
.password-panel{max-width:720px;margin:0 auto 20px}.password-panel .field{margin-bottom:14px}.password-note{padding:12px 14px;border-radius:10px;background:#f3f4f6;margin-bottom:16px}.force-password{border:2px solid #111827}
</style>
</head>
<body class="admin-shell">
<div id="loginView" class="login panel">
  <div class="eyebrow">管理者専用</div>
  <h1 style="font-size:38px">機械カタログ管理</h1>
  <p class="muted">スマートフォンでも操作しやすい管理画面です。</p>
  <form onsubmit="login(event)">
    <div class="field"><label>メールアドレス</label><input id="email" type="email" required placeholder="管理者メールアドレス"></div>
    <div class="field"><label>パスワード</label><div style="display:flex;gap:8px"><input id="password" type="password" required style="flex:1"><button class="btn" type="button" id="togglePassword">表示</button></div></div>
    <button class="btn primary" type="submit" style="width:100%">ログイン</button>
    <p id="loginMsg" class="muted"></p>
  </form>
</div>
<div id="adminView" class="hidden">
<header class="admin-top"><div class="admin-wrap admin-top-row"><div><strong>株式会社 山本オート</strong><div class="muted" style="font-size:12px">モバイル管理画面</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" onclick="togglePasswordPanel()">パスワード変更</button><button class="btn" type="button" onclick="logout()">ログアウト</button></div></div></header>
<main class="admin-wrap">
<div id="passwordPanel" class="panel password-panel hidden">
  <h2 style="font-size:28px">パスワード変更</h2>
  <div class="password-note">セキュリティのため、初回ログイン後に仮パスワードを変更してください。</div>
  <div class="field"><label>現在のパスワード</label><input id="currentPassword" type="password" autocomplete="current-password"></div>
  <div class="field"><label>新しいパスワード（12文字以上）</label><input id="newPassword" type="password" autocomplete="new-password"></div>
  <div class="field"><label>新しいパスワード（確認）</label><input id="confirmPassword" type="password" autocomplete="new-password"></div>
  <button class="btn primary" type="button" onclick="changeMyPassword()">パスワードを変更</button>
  <p id="passwordMsg" class="muted"></p>
</div>
<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2 style="font-size:28px">機械一覧</h2><div id="adminUser" class="muted"></div></div><button id="addMachineBtn" class="btn red" type="button">+ 機械を追加</button></div><div id="machineList" class="machine-list" style="margin-top:18px"></div></div>
<div id="editor" class="panel hidden">
  <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 id="editorTitle" style="font-size:28px">機械を追加</h2><button id="closeEditorBtn" class="btn" type="button">閉じる</button></div>
  <input type="hidden" id="pid">
  <div class="admin-grid"><div class="field"><label>機械タイトル</label><input id="ptitle" placeholder="Kubota KH-012 ミニショベル"></div><div class="field"><label>カテゴリー</label><input id="pcategory" placeholder="ミニショベル"></div></div>
  <div class="field"><label>説明</label><textarea id="pdesc" placeholder="機械の状態・特徴などを入力してください。"></textarea></div>
  <div class="admin-grid"><div class="field"><label>YouTube URL</label><input id="pvideo" placeholder="https://youtu.be/..."></div><div class="field"><label>販売状態</label><select id="pstatus"><option value="published">販売中</option><option value="draft">下書き</option><option value="sold">売約済み</option></select></div></div>
  <div class="admin-grid"><div class="field"><label>価格表示</label><select id="pmode"><option value="contact">価格はお問い合わせください</option><option value="show">価格を表示</option></select></div><div class="field"><label>価格（表示する場合）</label><input id="pprice" placeholder="¥1,280,000"></div></div>
  <div class="field"><label class="check-row"><input id="phome" type="checkbox"><span>ホーム画面に掲載する</span></label><div class="muted help-text">ホーム画面には1台のみ掲載できます。チェックした販売中の機械がホーム画面に表示されます。</div></div>
  <div class="field"><label>機械写真</label><input id="pimages" type="file" accept="image/*" multiple><div class="muted help-text">写真を複数選択できます。「サムネイルに設定」で代表写真を1枚選べます。</div><div id="imagePreview" class="image-manager"></div></div>
  <div class="field"><label>仕様 <span class="muted">（過去に使用した項目名を候補として表示）</span></label><div id="specs"></div><button id="addSpecBtn" type="button" class="btn">+ 仕様を追加</button></div>
  <div class="actions"><button id="saveMachineBtn" type="button" class="btn primary">機械を保存</button><button id="cancelEditorBtn" type="button" class="btn">キャンセル</button></div><p id="saveMsg" class="muted"></p>
</div>
</main></div>
<script src="admin.js"></script>
<script>
const $id=id=>document.getElementById(id);
$id('togglePassword')?.addEventListener('click',()=>{const x=$id('password');x.type=x.type==='password'?'text':'password'});
function togglePasswordPanel(){const p=$id('passwordPanel');p.classList.toggle('hidden');if(!p.classList.contains('hidden'))window.scrollTo({top:0,behavior:'smooth'});}
async function changeMyPassword(){const msg=$id('passwordMsg');msg.textContent='変更中…';msg.classList.remove('error-msg');const current=$id('currentPassword').value,newPw=$id('newPassword').value,confirmPw=$id('confirmPassword').value;try{if(newPw.length<12)throw new Error('新しいパスワードは12文字以上にしてください。');if(newPw!==confirmPw)throw new Error('新しいパスワードが一致しません。');const r=await fetch('/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:current,newPassword:newPw})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'パスワード変更に失敗しました。');msg.textContent='パスワードを変更しました。';$id('currentPassword').value='';$id('newPassword').value='';$id('confirmPassword').value='';}
catch(e){msg.classList.add('error-msg');msg.textContent=e.message||'パスワード変更に失敗しました。';}}
const originalShowAdmin=showAdmin;
showAdmin=function(email){originalShowAdmin(email);fetch('/api/admin/me').then(r=>r.json()).then(d=>{if(d.mustChangePassword){$id('passwordPanel').classList.remove('hidden');$id('passwordPanel').classList.add('force-password');window.scrollTo({top:0,behavior:'smooth'});}}).catch(()=>{});};
</script>
</body>
</html>
