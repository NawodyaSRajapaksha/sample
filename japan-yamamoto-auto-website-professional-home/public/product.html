<script src="app.js"></script><script>loadProductDetail();</script>
<script>
(function(){
  const KEY='yamamotoAutoRecentlyViewed', MAX=6;
  function record(){
    const d=document.getElementById('detail');
    const titleEl=d&&d.querySelector('h1,h2');
    if(!titleEl) return false;
    const title=titleEl.textContent.trim();
    if(!title) return false;
    const img=d.querySelector('img');
    let items=[];
    try{items=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){}
    items=items.filter(x=>x.url!==location.href);
    items.unshift({url:location.href,title:title,image:img?img.getAttribute('src'):'',viewedAt:Date.now()});
    try{localStorage.setItem(KEY,JSON.stringify(items.slice(0,MAX)));}catch(e){}
    return true;
  }
  let tries=0;
  const timer=setInterval(function(){if(record()||++tries>30)clearInterval(timer);},200);
})();
</script></body></html>
